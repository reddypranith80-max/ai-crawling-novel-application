[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "novel-bot"
version = "0.1.0"
description = "AI Crawling Novel Application: turn a web novel's website link into one all-in-one PDF or EPUB on your own device."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pranith" }]
keywords = ["web novel", "epub", "pdf", "crawler", "scraper", "ebook", "downloader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/reddypranith80-max/ai-crawling-novel-application"
Repository = "https://github.com/reddypranith80-max/ai-crawling-novel-application"

[project.scripts]
novelbot = "novelbot.cli.app:main"

# Third-party source plugins can register crawlers under this group:
#   [project.entry-points."novelbot.sources"]
#   mysite = "my_package.mysite:MySiteCrawler"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/novelbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: en dashes / angle quotes are intentional (typography, "Next ›" matching).
# B027: BaseCrawler.initialize is an intentionally empty optional hook.
ignore = ["RUF012", "RUF001", "RUF002", "RUF003", "B027"]
